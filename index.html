<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 IoT Dashboard - Dark Mode</title>
    <!-- Google Fonts & Chart.js -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-temp: #ff4757;
            --accent-hum: #2ed573;
            --accent-light: #ffa502;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            margin: 4px 0 0;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .status-badge {
            background-color: rgba(46, 213, 115, 0.1);
            border: 1px solid rgba(46, 213, 115, 0.3);
            color: var(--accent-hum);
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-hum);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-hum);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-value {
            font-size: 32px;
            font-weight: 600;
        }

        .temp-color { color: var(--accent-temp); }
        .hum-color { color: var(--accent-hum); }
        .light-color { color: var(--accent-light); }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
        }

        @media (max-width: 600px) {
            .charts-grid { grid-template-columns: 1fr; }
        }

        .chart-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .chart-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        canvas {
            width: 100% !important;
            max-height: 240px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header Section -->
        <div class="header">
            <div>
                <h1>ESP32 REALTIME DASHBOARD</h1>
                <p>Firebase Realtime Database · Node: esp32-01</p>
            </div>
            <div class="status-badge">
                <div class="pulse-dot"></div> Connected
            </div>
        </div>

        <!-- Metric Cards -->
        <div class="cards-grid">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Temperature</span>
                    <span class="temp-color">🌡️</span>
                </div>
                <div class="card-value temp-color" id="val-temp">-- °C</div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">Humidity</span>
                    <span class="hum-color">💧</span>
                </div>
                <div class="card-value hum-color" id="val-hum">-- %</div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">Light Level</span>
                    <span class="light-color">☀️</span>
                </div>
                <div class="card-value light-color" id="val-light">-- lx</div>
            </div>
        </div>

        <!-- Realtime Charts -->
        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-title">📈 Temperature Trend (°C)</div>
                <canvas id="tempChart"></canvas>
            </div>

            <div class="chart-card">
                <div class="chart-title">📊 Humidity Trend (%)</div>
                <canvas id="humChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // URL Firebase Realtime Database ของคุณ
        const dbUrl = "https://test1-bc558-default-rtdb.asia-southeast1.firebasedatabase.app/esp32-01.json";

        const maxDataPoints = 15;
        const timeLabels = [], tempHistory = [], humHistory = [];

        // กำหนดการตั้งค่าสไตล์กราฟในโหมดมืด
        const chartOptions = {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
                x: {
                    grid: { color: 'rgba(255, 255, 255, 0.05)' },
                    ticks: { color: '#94a3b8' }
                },
                y: {
                    grid: { color: 'rgba(255, 255, 255, 0.05)' },
                    ticks: { color: '#94a3b8' }
                }
            }
        };

        // สร้างกราฟอุณหภูมิ (สีแดงนีออน)
        const tempChart = new Chart(document.getElementById('tempChart'), {
            type: 'line',
            data: {
                labels: timeLabels,
                datasets: [{
                    data: tempHistory,
                    borderColor: '#ff4757',
                    backgroundColor: 'rgba(255, 71, 87, 0.15)',
                    fill: true,
                    tension: 0.4,
                    borderWidth: 2,
                    pointRadius: 4,
                    pointBackgroundColor: '#ff4757'
                }]
            },
            options: chartOptions
        });

        // สร้างกราฟความชื้น (สีเขียวนีออน)
        const humChart = new Chart(document.getElementById('humChart'), {
            type: 'line',
            data: {
                labels: timeLabels,
                datasets: [{
                    data: humHistory,
                    borderColor: '#2ed573',
                    backgroundColor: 'rgba(46, 213, 115, 0.15)',
                    fill: true,
                    tension: 0.4,
                    borderWidth: 2,
                    pointRadius: 4,
                    pointBackgroundColor: '#2ed573'
                }]
            },
            options: chartOptions
        });

        // ดึงข้อมูล Realtime ทุก 3 วินาที
        function fetchFirebaseData() {
            fetch(dbUrl)
                .then(response => response.json())
                .then(data => {
                    if (data) {
                        const timeNow = new Date().toLocaleTimeString();

                        // อัปเดตการ์ดแสดงผล
                        document.getElementById('val-temp').innerText = (data.temp || 0).toFixed(2) + " °C";
                        document.getElementById('val-hum').innerText = (data.humidity || 0).toFixed(2) + " %";
                        document.getElementById('val-light').innerText = (data.light || 0).toFixed(2) + " lx";

                        // จัดการคิวข้อมูลกราฟ
                        if (timeLabels.length >= maxDataPoints) {
                            timeLabels.shift();
                            tempHistory.shift();
                            humHistory.shift();
                        }
                        timeLabels.push(timeNow);
                        tempHistory.push(data.temp);
                        humHistory.push(data.humidity);

                        tempChart.update();
                        humChart.update();
                    }
                })
                .catch(err => console.error("Data Fetch Error:", err));
        }

        setInterval(fetchFirebaseData, 3000);
        fetchFirebaseData();
    </script>
</body>
</html>
